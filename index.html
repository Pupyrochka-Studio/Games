main{padding:0 14px}

.empty{color:var(--mu);text-align:center;padding:24px 0;font-size:14px}

      return `<div class="case" style="border-left:4px solid ${c.c||'#2a3157'}"><div class="ico">${c.i}</div><div class="i"><b>${c.n[L()]}</b><small>${ch}</small></div>
      <div class="col"><button class="btn" data-b="${c.id}" data-q="1" ${S.coins<c.p?'disabled':''}>${fmt(c.p)} 🪙</button>
      <button class="btn x" data-b="${c.id}" data-q="5" ${S.coins<c.p*5?'disabled':''}>×5</button></div></div>`}).join('')+`<div class="empty">${t('broke')}</div>`;
  }else if(tab===2){
    m.innerHTML=`<h3>${t('mg')}</h3><div class="case"><div class="ico">👆</div><div class="i"><b>${t('tapN')}</b><small>${t('tapD')}<br>⚡ ${t('en')}: <span id="enl"></span></small></div><button class="btn" id="tp" style="padding:18px 20px;font-size:16px">+${tapV()} 🪙</button></div>${upCards()}<div class="case"><div class="ico">🎁</div><div class="i"><b>${t('dN')}</b><small>${t('dD')}</small></div><button class="btn g" id="gb_daily" data-dl="1"></button></div>`+
    GM.map(g=>`<div class="case"><div class="ico">${g.i}</div><div class="i"><b>${t(g.id==='catch'?'g1n':g.id==='react'?'g2n':'g3n')}</b><small>${t(g.id==='catch'?'g1d':g.id==='react'?'g2d':'g3d')}</small></div><button class="btn g" id="gb_${g.id}" data-g="${g.id}"></button></div>`).join('');
    $('tp').onpointerdown=tapGo;updGames();
  }else{
    const cs=CASES.filter(c=>S.cases[c.id]>0);
    let h=`<h3>${t('mycases')}</h3>`+(cs.length?cs.map(c=>`<div class="case"><div class="ico">${c.i}</div><div class="i"><b>${c.n[L()]}</b><small>${t('stock')}: ${S.cases[c.id]}</small></div><button class="btn g" data-o="${c.id}">${t('open')}</button></div>`).join(''):`<div class="empty">${t('noCases')}</div>`);
    const ps=S.plates.filter(p=>flt==='all'||p.k===flt).sort((a,b)=>b.v-a.v),total=ps.reduce((a,p)=>a+p.v,0);
    h+=`<h3>${t('items')} (${ps.length}) · ${t('value')} ${fmt(total)} 🪙</h3><div class="bar">${['all','pl','ph'].map(f=>`<button class="btn ${flt===f?'':'x'}" data-f="${f}">${t(f==='all'?'fAll':f==='pl'?'fPl':'fPh')}</button>`).join('')}</div>`;
    const trs=[0,1,2,3].filter(r=>S.plates.filter(p=>p.r===r&&!p.lk).length>=5);
    if(trs.length)h+=`<div class="bar">${trs.map(r=>`<button class="btn g" data-tr="${r}">${t('trade')} ${rn(r)} → ${rn(r+1)}</button>`).join('')}</div>`;
    if(ps.length)h+=`<div class="bar"><button class="btn r" data-sa="1">${t('sellC')}</button><button class="btn r" data-sa="2">${t('sellR')}</button></div><div class="grid">`+
      ps.map(p=>`<div class="pc" style="--rc:${RAR[p.r].c}">${itemHTML(p)}<div class="m"><span class="rn">${rn(p.r)}</span>${p.pr?' ✨':''}<br>${cn(p.cc)}</div><div class="row"><span class="v">${fmt(p.v)} 🪙</span><span><button class="btn x" data-k="${p.id}">${p.lk?'🔒':'🔓'}</button> <button class="btn r" data-s="${p.id}" ${p.lk?'disabled':''}>${t('sell')}</button></span></div></div>`).join('')+'</div>';
    else h+=`<div class="empty">${t('noItems')}</div>`;
    m.innerHTML=h;
  }
}
