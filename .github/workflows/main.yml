name: Make icons
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draw icons
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          def icon(n, safe):
              im = Image.new('RGB', (n, n), '#0f1220')
              d = ImageDraw.Draw(im)
              w = int(n * (0.62 if safe else 0.86))
              h = int(w * 0.36)
              x = (n - w) // 2
              y = (n - h) // 2
              d.rounded_rectangle([x, y, x + w, y + h], radius=h // 6, fill='white', outline='#111111', width=max(2, n // 64))
              d.rounded_rectangle([x, y, x + int(w * 0.16), y + h], radius=h // 6, fill='#1747b8')
              try:
                  f = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSansMono-Bold.ttf', int(h * 0.5))
              except Exception:
                  f = ImageFont.load_default()
              d.text((x + int(w * 0.58), y + h // 2), '777', fill='#111111', font=f, anchor='mm')
              return im
          icon(192, False).save('icon-192.png')
          icon(512, False).save('icon-512.png')
          icon(512, True).save('icon-maskable-512.png')
          PY
      - name: Commit icons
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add icon-192.png icon-512.png icon-maskable-512.png
          git commit -m "Add icons" || echo nothing
          git push
